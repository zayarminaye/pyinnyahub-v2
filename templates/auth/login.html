{% extends 'base.html' %}

{% block title %}Login - Pyinnya Hub LMS{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5 mb-5">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-body p-5">
                    <h2 class="text-center mb-4">အကောင့်ဝင်မည်</h2>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="email" class="form-label">အီးမေးလ်</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">လျှို့ဝှက်နံပါတ်</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="remember" name="remember">
                            <label class="form-check-label" for="remember">
                                မှတ်ထားမည်
                            </label>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">ဝင်မည်</button>
                    </form>
                    <hr class="my-4">
                    <p class="text-center text-muted">
                        အကောင့်မရှိသေးပါသလား? <a href="{% url 'register' %}">စာရင်းသွင်းမည်</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
