{% extends 'base.html' %}

{% block title %}Reject Instructor Application{% endblock %}

{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0"><i class="bi bi-x-circle"></i> ဆရာ/ဆရာမ လျှောက်ထားမှု ငြင်းပယ်ခြင်း</h5>
                </div>
                <div class="card-body">
                    <p><strong>အမည်:</strong> {{ application.user.get_full_name }}</p>
                    <p><strong>Email:</strong> {{ application.user.email }}</p>

                    <form method="post" class="mt-4">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="reason" class="form-label">ငြင်းပယ်ရသည့် အကြောင်းအရာ</label>
                            <textarea class="form-control" id="reason" name="reason" rows="3" required>လိုအပ်ချက်များ မပြည့်မီပါ။</textarea>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-danger btn-lg">
                                <i class="bi bi-x"></i> ငြင်းပယ်မည်
                            </button>
                            <a href="{% url 'admin_dashboard' %}" class="btn btn-outline-secondary">ပယ်ဖျက်မည်</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
